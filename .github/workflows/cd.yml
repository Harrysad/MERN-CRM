name: CD

on:
  push:
    branches: [main]

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: |
            ghcr.io/harrysad/mern-crm-backend:latest
            ghcr.io/harrysad/mern-crm-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          push: true
          tags: |
            ghcr.io/harrysad/mern-crm-frontend:latest
            ghcr.io/harrysad/mern-crm-frontend:${{ github.sha }}
