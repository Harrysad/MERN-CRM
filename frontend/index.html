<!doctype html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      function showError(label, detail) {
        var box = document.createElement("pre");
        box.style.cssText =
          "position:fixed;top:0;left:0;right:0;z-index:99999;background:#2b0000;color:#fff;padding:1rem;white-space:pre-wrap;font-size:12px;max-height:60vh;overflow:auto;margin:0;";
        box.textContent = label + ": " + detail;
        document.body ? document.body.prepend(box) : window.addEventListener("DOMContentLoaded", function () { document.body.prepend(box); });
      }
      window.addEventListener("error", function (e) {
        showError("Błąd", (e.error && e.error.stack) || e.message || String(e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        showError("Niezłapany błąd Promise", (e.reason && e.reason.stack) || e.reason || String(e));
      });
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Project</title>
</head>

  <script type="module" src="/src/main.jsx"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
